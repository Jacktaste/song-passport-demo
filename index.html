<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
</head>
<body>
<title>Song Passport</title>
<link rel="stylesheet" href="css/app.css">
<style>
  /* Demo bar: a quiet strip above the real app, drawn with the app's own tokens so it follows light and dark. */
  #demo-bar { position: relative; z-index: 60; background: var(--surface); border-bottom: .5px solid var(--line-strong); font: 13px/1.3 var(--sans); color: var(--fg); }
  .db-in { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .db-tag { font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); background: var(--grad); padding: 3px 8px; border-radius: 999px; }
  .db-note { color: var(--muted); flex: 1 1 auto; min-width: 0; }
  .db-seg { display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 2px; }
  .db-seg button { border: 0; background: none; color: var(--fg-2); font: 600 12.5px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .db-seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
  .db-tour-btn { border: .5px solid var(--line-strong); background: var(--surface); color: var(--fg); font: 600 12.5px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .db-seg button:focus-visible, .db-tour-btn:focus-visible, .db-tour a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .db-tour { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: .5px solid var(--line-strong); box-shadow: var(--shadow-lg); max-height: min(70vh, 640px); overflow-y: auto;
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
  .db-who { color: var(--muted); margin: 0 0 10px; }
  .db-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 22px; }
  .db-groups h4 { font: 700 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  .db-groups a { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; color: inherit; text-decoration: none; }
  .db-groups a:hover { background: var(--surface-2); }
  .db-groups a b { font-weight: 600; }
  .db-groups a span { grid-column: 1; color: var(--muted); font-size: 12.5px; }
  .db-groups a i { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-style: normal; font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }
  @media (max-width: 560px) { .db-note { display: none; } .db-in { justify-content: space-between; } }
</style>
<div id="demo-bar"></div>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="js/demo-shim.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
